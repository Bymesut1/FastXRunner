name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Prepare icon
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          [ -f icon.png ] || convert -size 1024x1024 xc:'#d41f2a' icon.png
          for s in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $s
            mkdir -p app/src/main/res/mipmap-$1
            convert icon.png -resize $2x$2 app/src/main/res/mipmap-$1/ic_launcher.png || cp icon.png app/src/main/res/mipmap-$1/ic_launcher.png
          done
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FastXRunner-APK
          path: app/build/outputs/apk/debug/*.apk
